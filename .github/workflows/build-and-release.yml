name: Build and Release Driver Loader

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Build Tools & Apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool aapt zipalign

          # Optional: fetch latest apktool wrapper & jar if available
          mkdir -p /opt/apktool
          if wget -q --timeout=10 https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /opt/apktool/apktool; then
            if wget -q --timeout=15 https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.10.0.jar -O /opt/apktool/apktool.jar; then
              chmod +x /opt/apktool/apktool /opt/apktool/apktool.jar
              echo "/opt/apktool" >> $GITHUB_PATH
            fi
          fi

      - name: Verify Apktool Installation
        run: |
          apktool --version

      - name: Recompile APK (Safe Build)
        run: |
          mkdir -p build
          apktool b decompiled_source -o build/Driver_Loader_2.0_unsigned.apk

      - name: Sign APK with Debug Keystore / Uber-apk-signer
        run: |
          mkdir -p release_apk
          UBER_SIGNER_URL="https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar"
          if wget -q --timeout=15 "$UBER_SIGNER_URL" -O uber-apk-signer.jar; then
            echo "Signing with uber-apk-signer..."
            java -jar uber-apk-signer.jar -a build/Driver_Loader_2.0_unsigned.apk -o release_apk/ --overwrite
            OUTPUT_APK=$(find release_apk -type f -name "*.apk" | head -n 1)
            cp "$OUTPUT_APK" release_apk/Driver_Loader_2.0_kernel-4.9.337_MiA2Lite.apk
          else
            echo "Signing with debug keystore..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore debug.keystore \
              -storepass android build/Driver_Loader_2.0_unsigned.apk androiddebugkey
            cp build/Driver_Loader_2.0_unsigned.apk release_apk/Driver_Loader_2.0_kernel-4.9.337_MiA2Lite.apk
          fi

      - name: Create GitHub Release and Upload Artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="v2.0-kernel-4.9.337-$(date +'%Y%m%d%H%M%S')"
          gh release create "$RELEASE_TAG" release_apk/*.apk \
            --title "Driver Loader 2.0 - Kernel 4.9.337+58-perf (Xiaomi Mi A2 Lite)" \
            --notes "Safe compilation release for Xiaomi Mi A2 Lite (daisy/msm8953) with Android 15 (API 35) root compatibility and kernel 4.9.337+58-perf driver support."
